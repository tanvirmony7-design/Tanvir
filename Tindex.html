<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Sales Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-attendance { background-color: #28a745; }
        .btn-order { background-color: #ffc107; color: black; }
        .btn-location { background-color: #17a2b8; }
        
        /* Products List */
        .product-list {
            text-align: left;
            margin-top: 15px;
            display: none; /* Hidden by default */
        }
        .product-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="header">
        Sales Officer Dashboard
    </div>

    <div class="container">
        
        <!-- Attendance Section -->
        <div class="card">
            <h3>Daily Attendance</h3>
            <p id="time-display"></p>
            <button class="btn btn-attendance" onclick="giveAttendance()">✅ Give Attendance</button>
        </div>

        <!-- Location Section -->
        <div class="card">
            <h3>Market Visit Tracking</h3>
            <p>Update your current pharmacy/location.</p>
            <button class="btn btn-location" onclick="getLocation()">📍 Sync Live Location</button>
            <p id="location-status" style="color: green; font-size: 14px;"></p>
        </div>

        <!-- Order Section -->
        <div class="card">
            <h3>Take New Order</h3>
            <button class="btn btn-order" onclick="toggleProducts()">🛒 Open Product List</button>
            
            <div class="product-list" id="products">
                <div class="product-item">
                    <span>Napa Extra 500mg (Box)</span>
                    <input type="number" placeholder="Qty" style="width: 50px;">
                </div>
                <div class="product-item">
                    <span>Seclo 20mg (Box)</span>
                    <input type="number" placeholder="Qty" style="width: 50px;">
                </div>
                <button class="btn btn-attendance" style="margin-top: 15px;" onclick="submitOrder()">Submit Order</button>
            </div>
        </div>

    </div>

    <script>
        // Display Current Time
        document.getElementById('time-display').innerText = new Date().toLocaleString();

        function giveAttendance() {
            alert("Attendance recorded successfully for today!");
        }

        function getLocation() {
            document.getElementById('location-status').innerText = "Fetching location...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition);
            } else { 
                document.getElementById('location-status').innerText = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            document.getElementById('location-status').innerText = 
            "Location Synced! Lat: " + position.coords.latitude.toFixed(4) + 
            ", Long: " + position.coords.longitude.toFixed(4);
        }

        function toggleProducts() {
            var x = document.getElementById("products");
            if (x.style.display === "none" || x.style.display === "") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
        }

        function submitOrder() {
            alert("Order sent to Admin Panel successfully!");
            toggleProducts();
        }
    </script>

</body>
</html>
